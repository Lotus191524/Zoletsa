<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoletsa Fashion - Dresses</title>
  <link rel="stylesheet" href="zoletsa.css">
</head>
<body>

<!-- HEADER (you can reuse your header from index.html) -->
<header>
  <div class="logo">
    <img src="Products/Zoletsalogo.jpg" alt="Zoletsa Fashion Logo">
    <h1>Zoletsa</h1>
  </div>
  <nav>
      <a href="#hero">Home</a>
    <a href="dresses.html">Dresses</a>
    <a href="Knitwear.html">Knitwear</a>
    <a href="dresses.html">Bags</a>
    <a href="accessories.html">Accesories</a>
    
  </nav>
  

</header>
  
<!-- BREADCRUMB NAVIGATION -->
<nav class="breadcrumb">
  <a href="index.html#hero">Home</a> &gt; 
  <span>Dresses</span>
</nav>

<!-- DRESSES SECTION -->
<section id="dresses">
  <h2>Dresses</h2>
  <div class="product-grid">
    <!-- Example dress product -->
    <div class="product">
      <img src="dresses/CrimsonVeil.jpg" alt="Crimson Veil">
         <h3>Crimson Veil</h3>
      <p class="price">$120</p>
      <button class="add-to-cart" data-name="Crimson Veil" data-price="$120">
  Add to Cart
</button>
    </div>

    <div class="product">
      <img src="dresses/DaintyCharm.jpg" alt="Dainty Charm">
       <h3>Dainty Charm</h3>
      <p class="price">$220</p>
         <button class="add-to-cart" data-name="Dainty Charm" data-price="$220">
  Add to Cart
</button>
    </div>

     <div class="product">
      <img src="dresses/MochaElegance.jpg" alt="MochaElegance">
         <h3>Mocha Elegance</h3>
       <p class="price">$300</p>
          <button class="add-to-cart" data-name="Mocha Elegance" data-price="$300">
  Add to Cart
</button>    
    </div>

       <div class="product">
      <img src="dresses/RosewoodBelted.jpg" alt="RosewoodBelted">
          <h3>Rosewood Belted</h3>
         <p class="price">$350</p>
     <button class="add-to-cart" data-name="Rosewood Belted" data-price="$350">
  Add to Cart
</button>
    </div>

       <div class="product">
      <img src="dresses/ScarletExecutive.jpg" alt="ScarletExecutive">
      <h3>Scarlet Executive</h3>
         <p class="price">$700</p>  
            <button class="add-to-cart" data-name="Scarlet Executive" data-price="$700">
  Add to Cart
</button>
    </div>


       <div class="product">
      <img src="dresses/Velvet Flow.jpg" alt="Velvet Flow">
      <h3>Velvet Flow</h3>
           <p class="price">$550</p>
            <button class="add-to-cart" data-name="Velvet Flow" data-price="$550">
  Add to Cart
</button>
    </div>


       <div class="product">
      <img src="dresses/Zest of Naija.jpg" alt="Zest of Naija">
      <h3>Zest of Naija</h3>
           <p class="price">$450</p>
            <button class="add-to-cart" data-name="Zest of Naija" data-price="$450">
  Add to Cart
</button>
    </div>

  </div>
</section>

<script src="zoletsascript.js"></script>

<!-- Cart Icon -->
<div id="cart-icon" class="cart-icon" title="View cart">
  <span>🛒</span>
  <span class="cart-badge" id="cart-count">0</span>
</div>

<!-- Cart Modal -->
<div id="cart-modal" class="cart-modal" style="display:none;">
  <div class="panel">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: <span id="cart-total">R0.00</span></h3>

    <div style="display:flex; gap:8px; margin-top:12px;">
      <button onclick="closeCart()">Close</button>
      <a href="cart.html"><button style="background:#b38a63; color:#fff; border:none; padding:8px 12px; border-radius:6px;">View full cart</button></a>
    </div>
  </div>
</div>

</body>
</html>
