<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoletsa Fashion - Bags</title>
  <link rel="stylesheet" href="zoletsa.css">
</head>
<body>

<!-- HEADER (you can reuse your header from index.html) -->
<header>
  <div class="logo">
    <img src="Products/Zoletsalogo.jpg" alt="Zoletsa Fashion Logo">
    <h1>Zoletsa</h1>
  </div>
  <nav>
      <a href="#hero">Home</a>
    <a href="dresses.html">Dresses</a>
    <a href="Knitwear.html">Knitwear</a>
    <a href="dresses.html">Bags</a>
    <a href="accessories.html">Accesories</a>
    <a href="bottoms.html">Bottoms & Jeans</a>
<a href="swimwear.html">Swimwear</a>
</nav>
  

</header>
  
<!-- BREADCRUMB NAVIGATION -->
<nav class="breadcrumb">
  <a href="index.html#hero">Home</a> &gt; 
  <span>Bags</span>
</nav>

<!-- Bags SECTION -->
<section id="Bags">
  <h2>Bags</h2>
  <div class="product-grid">
    
    <div class="product">
      <img src="https://i.pinimg.com/736x/63/90/2a/63902aeca49625c30c13cd520dfc195d.jpg" alt="Aurora Drop">
         <h3>Aurora Drop</h3>
      <p class="price">$1200</p>
      <button class="add-to-cart" data-name="Aurora Drop" data-price="$1200">
  Add to Cart
</button>
    </div>

    <div class="product">
      <img src="Bags/Blackcoralit.jpg" alt="Blackcoralit">
       <h3>Blackcoralit</h3>
      <p class="price">$500</p>
         <button class="add-to-cart" data-name="Blackcoralit" data-price="$500">
  Add to Cart
</button>
    </div>

     <div class="product">
      <img src="Bags/MidnightShell.jpg" alt="MidnightShell">
         <h3>Midnight Shell</h3>
       <p class="price">$1500</p>
          <button class="add-to-cart" data-name="Midnight Shell" data-price="$1500">
  Add to Cart
</button>    
    </div>

       <div class="product">
      <img src="Bags/Slyth.jpg" alt="Slyth">
          <h3>Slyth</h3>
         <p class="price">$600</p>
     <button class="add-to-cart" data-name="Slyth" data-price="$600">
  Add to Cart
</button>
    </div>

       <div class="product">
      <img src="Bags/SnowBelle.jpg" alt="SnowBelle">
      <h3>SnowBelle</h3>
         <p class="price">$900</p>  
            <button class="add-to-cart" data-name="SnowBelle" data-price="$900">
  Add to Cart
</button>
    </div>


       <div class="product">
      <img src="Bags/Crocella.jpg" alt="Crocella">
      <h3>Crocella</h3>
           <p class="price">$1300</p>
            <button class="add-to-cart" data-name="Crocella" data-price="1300">
  Add to Cart
</button>
    </div>


       <div class="product">
      <img src="Bags/Pearlina.jpg" alt="Pearlina">
      <h3>Pearlina</h3>
           <p class="price">$1200</p>
            <button class="add-to-cart" data-name="Pearlina" data-price="$1200">
  Add to Cart
</button>
    </div>

  </div>
</section>

<script src="zoletsascript.js"></script>

<!-- Cart Icon -->
<div id="cart-icon" class="cart-icon" title="View cart">
  <span>🛒</span>
  <span class="cart-badge" id="cart-count">0</span>
</div>

<!-- Cart Modal -->
<div id="cart-modal" class="cart-modal" style="display:none;">
  <div class="panel">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: <span id="cart-total">R0.00</span></h3>

    <div style="display:flex; gap:8px; margin-top:12px;">
      <button onclick="closeCart()">Close</button>
      <a href="cart.html"><button style="background:#b38a63; color:#fff; border:none; padding:8px 12px; border-radius:6px;">View full cart</button></a>
    </div>
  </div>
</div>

</body>
</html>
